server:
  port: ${USER_SERVICE_PORT:7445}

spring:
  banner:
    location: classpath:banner.txt
    mode: console
  application:
    name: x-user-service
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  profiles:
    # local-seed creates admin / Admin@123456 on empty DB
    default: local,local-seed
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    # DatabaseMigrations runs Flyway after Hibernate has created the tables.
    enabled: false

# Used only when Spring profile "local-seed" is active.
x:
  http:
    logging:
      enabled: true
      server: x-user-service
      hop: "x-api-gateway → x-bff → x-user-service"
      hops:
        /internal/users: "x-api-gateway → x-bff → x-user-service"
        /api/v1/users: "x-api-gateway → x-bff → x-user-service"
  redis:
    enabled: ${X_REDIS_ENABLED:true}
    key-prefix: x
    default-ttl: 10m
    caches:
      user-by-username: 10m
  telegram:
    auth-bot-token: ${TELEGRAM_AUTH_BOT_TOKEN:}
    auth-api-base-url: ${TELEGRAM_AUTH_API_BASE_URL:https://api.telegram.org}
    auth-polling-enabled: ${TELEGRAM_AUTH_POLLING_ENABLED:true}
  seed:
    admin-username: ${X_SEED_ADMIN_USERNAME:admin}
    admin-password: ${X_SEED_ADMIN_PASSWORD:Admin@123456}
    admin-full-name: ${X_SEED_ADMIN_FULL_NAME:System Administrator}
    admin-email: ${X_SEED_ADMIN_EMAIL:admin@x.local}

security:
  mfa:
    email:
      from: ${MAIL_FROM:}
